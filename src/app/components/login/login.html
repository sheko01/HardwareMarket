<div class="login-page">
  <div class="login-card">
    <h2 class="login-title">&#9881; HardwareMarket</h2>
    <p class="login-sub">Sign in to your account</p>

    <div class="role-hints">
      <button type="button" class="hint-btn admin" (click)="fillAdmin()">Login as Admin</button>
      <button type="button" class="hint-btn user" (click)="fillUser()">Login as User</button>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          [(ngModel)]="username"
          name="username"
          placeholder="admin / user"
          class="form-control"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          class="form-control"
          required
        />
      </div>

      @if (error()) {
        <p class="error-msg">{{ error() }}</p>
      }

      <button type="submit" class="submit-btn" [disabled]="loading()">
        {{ loading() ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>
  </div>
</div>
